[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoexplorer"
version = "2.0.0"
description = "A conversational agent for exploring any neighbourhood by address, grounded in the HERE Location Services APIs."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.50",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-openai>=0.7,<0.8",
    "llama-index-llms-anthropic>=0.11,<0.12",
    "llama-index-llms-google-genai>=0.10,<0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydeck>=0.9",
    "flexpolyline>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:geoexplorer.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# No python_version pin: mypy should type-check against whatever interpreter runs it,
# and numpy's bundled stubs require 3.12+ syntax.
packages = ["geoexplorer"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pydeck.*", "streamlit.*", "llama_index.*", "flexpolyline.*"]
ignore_missing_imports = true
